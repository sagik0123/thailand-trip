<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המסע לתאילנד</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f8f6;--card:#fff;--ink:#12302f;--mute:#5f7977;--sea:#0b5d5b;--mango:#f4a300;--lotus:#d63f6c;--line:#d6e4e1}
@media(prefers-color-scheme:dark){:root{--bg:#0d1f1e;--card:#15302e;--ink:#e8f3f1;--mute:#93b0ac;--sea:#4fc3bd;--line:#264846}}
*{box-sizing:border-box}
body{margin:0;font-family:Heebo,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
header{background:linear-gradient(160deg,#0b5d5b,#0f8a7e 60%,#f4a300);color:#fff;padding:28px 18px 22px;border-radius:0 0 28px 28px}
h1{margin:0;font-size:30px;font-weight:800}
.sub{opacity:.9;margin-top:4px}
.count{margin-top:14px;display:inline-block;background:#0004;padding:8px 14px;border-radius:12px;font-weight:600}
main{max-width:720px;margin:auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 2px;font:inherit;font-size:12px;color:var(--mute);cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--sea);font-weight:800}
.tab{display:none}.tab.on{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;font:inherit;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--sea);color:#fff;border-color:var(--sea)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:17px}
.card p{margin:4px 0;color:var(--mute);white-space:pre-wrap}
.tag{font-size:12px;color:var(--sea);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{border:0;background:var(--sea);color:#fff;padding:9px 15px;border-radius:10px;font:inherit;cursor:pointer;text-decoration:none;font-size:14px}
.btn.alt{background:none;color:var(--sea);border:1px solid var(--sea)}
.btn.del{background:none;color:var(--lotus);border:1px solid var(--lotus)}
.add{width:100%;margin:6px 0 14px;padding:12px;font-weight:600;background:var(--mango);color:#2a1d00}
.task{display:flex;gap:10px;align-items:center;padding:11px 14px}
.task input{width:20px;height:20px;accent-color:var(--sea)}
.task.done span{text-decoration:line-through;opacity:.5}
.task span{flex:1}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink);margin-top:4px}
label{display:block;margin-top:10px;font-size:14px;color:var(--mute)}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:10}
#modal.on{display:flex}
#box{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;z-index:20;pointer-events:none}
#toast.on{opacity:1}
.btn:disabled{opacity:.3;cursor:default}
.empty{text-align:center;color:var(--mute);padding:24px}
pre{background:var(--bg);padding:10px;border-radius:10px;overflow:auto;direction:ltr;text-align:left;font-size:12px}
.big{font-size:22px;font-weight:800}
</style>
</head>
<body>
<header>
  <h1>🇹🇭 המסע לתאילנד</h1>
  <div class="sub">בנגקוק · צ'אנג מאי · קופנגן · קוסמוי</div>
  <div class="count" id="count"></div>
</header>
<main>
  <section class="tab on" id="t-days"></section>
  <section class="tab" id="t-places"></section>
  <section class="tab" id="t-money"></section>
  <section class="tab" id="t-tasks"></section>
  <section class="tab" id="t-logi"></section>
  <section class="tab" id="t-tools"></section>
</main>
<nav id="nav"></nav>
<div id="modal"><div id="box"></div></div>
<div id="toast"></div>

<script>
const CITIES=["בנגקוק","צ'אנג מאי","קופנגן","קוסמוי"];
const CATS=["מסעדה 🍜","בית קפה ☕","אטרקציה 📸","שופינג 🛍️","חוף 🏝️","לילה 🍹"];
const DOCCATS=["טיסות ✈️","מלונות 🏨","תחבורה 🚌","ביטוח 🛡️","דרכונים 🛂","כללי 📄"];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const DEFAULT={start:"",ts:0,
 days:[
  ["בנגקוק","יום 1: נחיתה","התמקמות במלון, שוק לילה ואוכל רחוב"],
  ["בנגקוק","יום 2: העיר העתיקה","ארמון המלך, ואט פו, ואט ארון, סיור בתעלות"],
  ["בנגקוק","יום 3: שופינג ואוכל","צ'טוצ'אק, מגה מולים, ירכסי צ'יינהטאון בערב"],
  ["צ'אנג מאי","יום 4: טיסה לצ'אנג מאי","העיר העתיקה, מקדשים, שוק ליל ראשון"],
  ["צ'אנג מאי","יום 5: פילים","שמורת פילים אתית, בישול תאילנדי"],
  ["צ'אנג מאי","יום 6: דוי סוטפ","מקדש על ההר, קפה בהרים, ספא"],
  ["קופנגן","יום 7: טיסה לקוסמוי ומעבורת","הגעה לקופנגן, התמקמות"],
  ["קופנגן","יום 8: חופים","חוף האד רין, קיאקים, שקיעה"],
  ["קופנגן","יום 9: יום חופשי","שנורקלינג, אוכל מקומי"],
  ["קוסמוי","יום 10: מעבורת לקוסמוי","חוף שאוונג, מסעדות ליד המים"],
  ["קוסמוי","יום 11: אי","בודהה הגדול, אנג תונג מרין פארק"],
  ["קוסמוי","יום 12: טיסה הביתה","נסיעה לשדה"]
 ].map(d=>({id:uid(),city:d[0],title:d[1],desc:d[2]})),
 places:[
  {id:uid(),name:"שוק צ'טוצ'אק",city:"בנגקוק",cat:CATS[3],addr:"Chatuchak Market Bangkok",note:"שישי-ראשון, לצאת מוקדם"},
  {id:uid(),name:"ואט פו",city:"בנגקוק",cat:CATS[2],addr:"Wat Pho Bangkok",note:"בודהה שוכב"},
  {id:uid(),name:"שוק ליל ראשון",city:"צ'אנג מאי",cat:CATS[3],addr:"Sunday Walking Street Chiang Mai",note:"אוכל רחוב וממכרים"},
  {id:uid(),name:"האד רין",city:"קופנגן",cat:CATS[4],addr:"Haad Rin Beach Koh Phangan",note:"חוף מרכזי"},
  {id:uid(),name:"בודהה הגדול",city:"קוסמוי",cat:CATS[2],addr:"Big Buddha Koh Samui",note:"נוף יפה בשקיעה"}
 ],
 tasks:["דרכון בתוקף 6 חודשים","ביטוח נסיעות","כרטיס SIM או eSIM","מטען ומתאם לשקע","קרם הגנה וכובע","כרטיס אשראי ללא עמלות","הזמנת מעבורות"].map(t=>({id:uid(),t,done:false})),
 docs:[]};

let S=JSON.parse(localStorage.getItem('thS')||'null')||DEFAULT;
let URLX=localStorage.getItem('thUrl')||'';
const PEOPLE=["שגיא","אושר","קרן"],TIPS=[10,15,18,20,22];
let cityF='הכל',catF='הכל',docF='הכל',tab='days',R=JSON.parse(localStorage.getItem('thR')||'null')||{thb:0.11,usd:3.7},timer=null,taskF='הכל',lg='טיסות',W=JSON.parse(localStorage.getItem('thW')||'{}');
function mig(){S.exp=S.exp||[];S.tr=S.tr||[];S.hotels=S.hotels||[];S.tasks.forEach(k=>{k.owner=k.owner||'משותף'});(S.docs||[]).forEach(d=>{if(d.link&&!d.links){d.links=d.link;delete d.link}if(!PEOPLE.includes(d.owner))d.owner='';if(!d.loc){const c=d.cat||'';d.loc=c.startsWith('ביטוח')?'ביטוח':c.startsWith('טיסות')?'טיסות':c.startsWith('מלונות')?'מלונות':'מסמכים'}})}
mig();

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function persist(){S.ts=Date.now();localStorage.setItem('thS',JSON.stringify(S));clearTimeout(timer);if(URLX)timer=setTimeout(push,1500);render()}

async function push(){
  if(!URLX)return toast('הדבק קישור Google Sheets בלשונית כלים');
  try{await fetch(URLX,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(S)});toast('נשמר בענן ☁️')}
  catch(e){toast('שמירה נכשלה, בדוק את הקישור')}
}
async function pull(silent){
  if(!URLX)return;
  try{
    const r=await fetch(URLX);const d=await r.json();
    if(d&&d.days&&(d.ts||0)>(S.ts||0)){S=d;mig();localStorage.setItem('thS',JSON.stringify(S));render();if(!silent)toast('עודכן מהענן 🔄')}
    else if((S.ts||0)>(d.ts||0))push();else if(!silent)toast('הכול מעודכן ✓')
  }catch(e){if(!silent)toast('טעינה נכשלה, בדוק את הקישור')}
}

function form(title,fields,init,onSave,onDelete){
  const b=document.getElementById('box');
  b.innerHTML=`<h2>${title}</h2>`+fields.map(f=>{
    const v=esc(init[f.k]||'');
    if(f.opts)return `<label>${f.l}<select data-k="${f.k}">${f.opts.map(o=>`<option ${o==init[f.k]?'selected':''}>${o}</option>`).join('')}</select></label>`;
    if(f.chk)return `<label>${f.l}</label><div class="row">${PEOPLE.map(p=>`<label style="display:inline-flex;gap:6px;align-items:center;margin:0"><input type="checkbox" style="width:auto;margin:0" data-c="${f.k}" value="${p}" ${(init[f.k]||[]).includes(p)?'checked':''}>${p}</label>`).join('')}</div>`;
    if(f.area)return `<label>${f.l}<textarea rows="4" data-k="${f.k}">${v}</textarea></label>`;
    return `<label>${f.l}<input ${f.t?`type="${f.t}" `:''}data-k="${f.k}" value="${v}"></label>`}).join('')+
  `<div class="row"><button class="btn" id="sv">שמור</button><button class="btn alt" id="cx">ביטול</button>${onDelete?'<button class="btn del" id="dl">מחק</button>':''}</div>`;
  const m=document.getElementById('modal');m.classList.add('on');
  const close=()=>m.classList.remove('on');
  b.querySelector('#cx').onclick=close;
  b.querySelector('#sv').onclick=()=>{const o={};b.querySelectorAll('[data-k]').forEach(e=>o[e.dataset.k]=e.value.trim());fields.filter(f=>f.chk).forEach(f=>o[f.k]=[...b.querySelectorAll(`[data-c="${f.k}"]:checked`)].map(e=>e.value));onSave(o);close()};
  if(onDelete)b.querySelector('#dl').onclick=()=>{onDelete();close()};
}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.target.classList.remove('on')};

function edit(list,fields,id,def){
  const it=id?S[list].find(x=>x.id===id):null;
  form(it?'עריכה':'הוספה',fields,it||def||{},o=>{if(it)Object.assign(it,o);else S[list].push({id:uid(),...o});persist()},it?()=>{S[list]=S[list].filter(x=>x.id!==id);persist()}:null);
}
const F={
 days:[{k:'city',l:'עיר',opts:CITIES},{k:'title',l:'כותרת'},{k:'desc',l:'תוכנית',area:1}],
 places:[{k:'name',l:'שם המקום'},{k:'city',l:'עיר',opts:CITIES},{k:'cat',l:'קטגוריה',opts:CATS},{k:'addr',l:'כתובת לניווט'},{k:'note',l:'הערה',area:1}],
 exp:[{k:'what',l:'על מה'},{k:'payer',l:'מי שילם',opts:PEOPLE},{k:'amt',l:'סכום',t:'number'},{k:'cur',l:'מטבע',opts:['฿','$','₪']},{k:'for',l:'מתחלקים בין',chk:1}],
 tr:[{k:'type',l:'סוג',opts:['✈️ טיסה','⛴️ מעבורת','🚌 אוטובוס','🚕 אחר']},{k:'title',l:'מסלול (בנגקוק → צאנג מאי)'},{k:'date',l:'תאריך',t:'date'},{k:'time',l:'שעה',t:'time'},{k:'ref',l:'מספר הזמנה / טיסה'},{k:'note',l:'הערות ונקודת איסוף',area:1}],
 hotels:[{k:'name',l:'שם המלון'},{k:'city',l:'עיר',opts:CITIES},{k:'cin',l:'צ׳ק-אין',t:'date'},{k:'cout',l:'צ׳ק-אאוט',t:'date'},{k:'addr',l:'כתובת באנגלית'},{k:'thai',l:'כתובת בתאילנדית (מההזמנה, לא חובה)',area:1},{k:'phone',l:'טלפון'},{k:'ref',l:'מספר הזמנה'}],
 docs:[{k:'loc',l:'באיזה מקום להציג את המסמך',opts:['טיסות','מלונות','ביטוח','מסמכים']},{k:'owner',l:'של מי המסמך',opts:PEOPLE},{k:'cat',l:'קטגוריה',opts:DOCCATS},{k:'title',l:'כותרת'},{k:'det',l:'פרטים',area:1},{k:'links',l:'קישורים (אחד בכל שורה, אפשר כמה)',area:1}]
};
const chips=(arr,cur,fn)=>`<div class="chips">${['הכל',...arr].map(c=>`<button class="chip ${c===cur?'on':''}" onclick="${fn}('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('')}</div>`;
window.setCity=c=>{cityF=c;render()};window.setCat=c=>{catF=c;render()};window.setTask=c=>{taskF=c;render()};window.setLg=i=>{lg=['טיסות','מלונות','ביטוח','מסמכים','הראה לנהג'][i];render()};window.goCity=i=>{if(CITIES[i]){cityF=CITIES[i];go('places')}};window.setDoc=c=>{docF=c;render()};

function render(){
  const nav=[['days','📅','לו"ז'],['places','📍','מקומות'],['money','💰','כסף'],['tasks','✅','צ\'קליסט'],['logi','🧳','לוגיסטיקה'],['tools','⚙️','כלים']];
  document.getElementById('nav').innerHTML=nav.map(n=>`<button class="${tab===n[0]?'on':''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id==='t-'+tab));
  const c=document.getElementById('count');
  if(S.start){const d=Math.ceil((new Date(S.start)-new Date())/864e5);c.textContent=d>0?`עוד ${d} ימים להמראה ✈️`:d===0?'ממריאים היום! ✈️':'בטיול! 🌴'}
  else c.textContent='קבע תאריך יציאה בלשונית כלים';
  if(!navigator.onLine)c.textContent+=' · 📴 לא מקוון';

  const base=S.start?new Date(S.start+'T00:00'):null,today=new Date();today.setHours(0,0,0,0);
  const fd=d=>d.toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'});
  const ti=base?Math.round((today-base)/864e5):-1,td=S.days[ti];
  const days=S.days.map((d,i)=>({...d,i})).filter(d=>cityF==='הכל'||d.city===cityF);
  t('days').innerHTML=(td?`<div class="card" style="border:2px solid var(--mango)"><span class="tag">היום · ${fd(today)} · ${esc(td.city)}</span><h3>${esc(td.title)}</h3><p>${esc(td.desc)}</p><button class="btn alt" onclick="goCity(${CITIES.indexOf(td.city)})">מקומות ב${esc(td.city)}</button></div>`:'')+weatherHTML()+chips(CITIES,cityF,'setCity')+`<button class="btn add" onclick="edit('days',F.days)">+ הוסף יום</button>`+
   (days.map(d=>`<div class="card" ${d.i===ti?'style="border:2px solid var(--mango)"':''} onclick="edit('days',F.days,'${d.id}')"><span class="tag">${esc(d.city)}${base?' · '+fd(new Date(+base+d.i*864e5)):''}</span><h3>${esc(d.title)}</h3><p>${esc(d.desc)}</p></div>`).join('')||'<div class="empty">אין ימים בעיר הזו</div>');

  const pl=S.places.filter(p=>(cityF==='הכל'||p.city===cityF)&&(catF==='הכל'||p.cat===catF));
  t('places').innerHTML=chips(CITIES,cityF,'setCity')+chips(CATS,catF,'setCat')+`<button class="btn add" onclick="edit('places',F.places,null,{city:cityF==='הכל'?CITIES[0]:cityF})">+ הוסף מקום</button>`+
   (pl.map(p=>`<div class="card"><span class="tag">${esc(p.city)} · ${esc(p.cat)}</span><h3>${esc(p.name)}</h3><p>${esc(p.note)}</p><div class="row">${p.addr?`<a class="btn" target="_blank" href="https://waze.com/ul?q=${encodeURIComponent(p.addr)}&navigate=yes">Waze</a><a class="btn alt" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.addr)}">Google Maps</a>`:''}<button class="btn alt" onclick="edit('places',F.places,'${p.id}')">עריכה</button></div></div>`).join('')||'<div class="empty">עוד אין מקומות כאן. הוסיפו את הראשון!</div>');

  t('money').innerHTML=moneyHTML();
  t('tasks').innerHTML=tasksHTML();
  t('logi').innerHTML=logiHTML();

  t('tools').innerHTML=`<div class="card"><h3>📆 תאריך יציאה</h3><input type="date" id="sd" value="${S.start||''}" onchange="S.start=this.value;persist()"></div>
  <div class="card"><h3>☁️ סנכרון Google Sheets</h3><p>הדבק כאן את קישור ה-Web App (ראה הוראות בצ'אט). כל מי שמשתמש באותו קישור רואה את אותם נתונים.</p>
  <input id="url" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(URLX)}">
  <div class="row"><button class="btn" onclick="saveUrl()">חבר</button><button class="btn alt" onclick="push()">שמור לענן</button><button class="btn alt" onclick="pull()">טען מהענן</button></div>
  <p>${URLX?'מחובר. שמירה אוטומטית אחרי כל שינוי.':'לא מחובר. הנתונים נשמרים רק במכשיר הזה.'}</p></div>
  <div class="card"><h3>💵 המרת מטבע לשקל</h3>
  <p>בהט ฿</p><div class="row"><input id="thb" type="number" placeholder="฿" oninput="conv('thb')" style="flex:1;margin:0"><span>⇄</span><input id="thbi" type="number" placeholder="₪" oninput="conv('thb',1)" style="flex:1;margin:0"></div>
  <p>דולר $</p><div class="row"><input id="usd" type="number" placeholder="$" oninput="conv('usd')" style="flex:1;margin:0"><span>⇄</span><input id="usdi" type="number" placeholder="₪" oninput="conv('usd',1)" style="flex:1;margin:0"></div>
  <p>שער: ${R.thb.toFixed(3)} ₪ לבהט · ${R.usd.toFixed(3)} ₪ לדולר</p></div>
  <div class="card"><h3>🧾 חישוב טיפ</h3><input id="bill" type="number" placeholder="סכום החשבון" oninput="tip()"><div id="tips" style="margin-top:10px"></div></div>
  <div class="card"><h3>🚨 מספרים חשובים</h3><p>משטרת תיירים: 1155\nחירום: 191\nשגרירות ישראל בבנגקוק: +66-2-204-9200</p></div>`;
}

const WC={'בנגקוק':[13.75,100.5],"צ'אנג מאי":[18.79,98.98],'קופנגן':[9.74,100.03],'קוסמוי':[9.51,100.01]};
const wi=c=>c==0?'☀️':c<3?'🌤️':c==3?'☁️':c<50?'🌫️':c<70?'🌧️':c<80?'❄️':c<90?'🌦️':'⛈️';
function weatherHTML(){return '<h3 style="margin:4px 0 8px">🌤️ מזג אוויר</h3><div class="chips">'+CITIES.map(c=>{const w=W[c];if(!w)return `<div class="card" style="min-width:150px;flex:none"><b>${esc(c)}</b><p>אין נתונים</p></div>`;const d=w.d,dn=k=>new Date(d.time[k]).toLocaleDateString('he-IL',{weekday:'short'});return `<div class="card" style="min-width:170px;flex:none;margin:0"><b>${esc(c)}</b><div class="big">${wi(d.weather_code[0])} ${Math.round(d.temperature_2m_max[0])}°</div><p>גשם ${d.precipitation_probability_max[0]}%</p>${[1,2,3].map(k=>`<div class="tag">${dn(k)} ${wi(d.weather_code[k])} ${Math.round(d.temperature_2m_max[k])}° · ${d.precipitation_probability_max[k]}%</div>`).join('')}</div>`}).join('')+'</div>'}
async function loadWeather(){for(const c of CITIES){try{const[a,b]=WC[c];const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${a}&longitude=${b}&daily=weather_code,temperature_2m_max,precipitation_probability_max&timezone=auto&forecast_days=4`);const j=await r.json();if(j.daily)W[c]={t:Date.now(),d:j.daily}}catch(e){}}localStorage.setItem('thW',JSON.stringify(W));render()}
const ils=(a,c)=>c==='฿'?a*R.thb:c==='$'?a*R.usd:a;
function moneyHTML(){
  const paid={},share={},net={};PEOPLE.forEach(p=>paid[p]=share[p]=0);let tot=0;
  S.exp.forEach(e=>{const a=ils(+e.amt||0,e.cur),w=e.for&&e.for.length?e.for:PEOPLE;tot+=a;if(paid[e.payer]!==undefined)paid[e.payer]+=a;w.forEach(p=>share[p]+=a/w.length)});
  PEOPLE.forEach(p=>net[p]=paid[p]-share[p]);
  const cr=PEOPLE.filter(p=>net[p]>.5).map(p=>[p,net[p]]),db=PEOPLE.filter(p=>net[p]<-.5).map(p=>[p,-net[p]]),tr=[];
  while(cr.length&&db.length){cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);const m=Math.min(cr[0][1],db[0][1]);tr.push(`${db[0][0]} משלם/ת ל${cr[0][0]} ₪${m.toFixed(0)}`);cr[0][1]-=m;db[0][1]-=m;if(cr[0][1]<.5)cr.shift();if(db[0][1]<.5)db.shift()}
  return `<div class="card"><h3>סה"כ הוצאות: ₪${tot.toFixed(0)}</h3>${PEOPLE.map(p=>`<div class="row" style="justify-content:space-between;margin:4px 0"><b>${p}</b><span>שילם ₪${paid[p].toFixed(0)} · חלק ₪${share[p].toFixed(0)}</span><span class="tag" style="color:${net[p]<0?'var(--lotus)':'var(--sea)'}">${net[p]>=0?'+':''}${net[p].toFixed(0)}</span></div>`).join('')}<p><b>${tr.length?'איך סוגרים חשבון:':'הכול מאוזן ✓'}</b>\n${tr.join('\n')}</p><p class="tag">שערי המרה נוכחיים, מתעדכנים כשיש אינטרנט</p></div>
  <button class="btn add" onclick="edit('exp',F.exp,null,{payer:PEOPLE[0],cur:'฿',for:[...PEOPLE]})">+ הוסף הוצאה</button>`+
  (S.exp.slice().reverse().map(e=>`<div class="card"><span class="tag">${esc(e.payer)} שילם/ה · ${esc((e.for&&e.for.length?e.for:PEOPLE).join(', '))}</span><h3>${esc(e.what)}</h3><p>${esc(e.amt)} ${esc(e.cur)} ≈ ₪${ils(+e.amt||0,e.cur).toFixed(0)}</p><button class="btn alt" onclick="edit('exp',F.exp,'${e.id}')">עריכה</button></div>`).join('')||'<div class="empty">עוד אין הוצאות. הוסיפו את הראשונה!</div>')}
function tasksHTML(){const l=S.tasks.filter(k=>taskF==='הכל'||k.owner===taskF),dn=l.filter(k=>k.done).length;
  return chips(['משותף',...PEOPLE],taskF,'setTask')+`<div class="row" style="margin:0 0 12px"><input id="nt" placeholder="משימה חדשה" style="flex:1;margin:0"><button class="btn" onclick="addTask()">הוסף</button></div><p class="tag">${dn}/${l.length} הושלמו</p>`+
  l.map(k=>`<div class="card task ${k.done?'done':''}"><input type="checkbox" ${k.done?'checked':''} onchange="tog('${k.id}')"><span>${esc(k.t)}${taskF==='הכל'?` <small class="tag">${esc(k.owner)}</small>`:''}</span><button class="btn del" onclick="delTask('${k.id}')">✕</button></div>`).join('')}
function docsHTML(loc){const dl=S.docs.filter(d=>(d.loc||'מסמכים')===loc&&(docF==='הכל'||d.owner===docF));
  const lk=d=>(d.links||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>/^https?:\/\//i.test(x)?x:'https://'+x);
  return (loc==='טיסות'||loc==='מלונות'?'<h3 style="margin:16px 0 8px">📎 מסמכים</h3>':'')+chips(PEOPLE,docF,'setDoc')+`<button class="btn add" onclick="edit('docs',F.docs,null,{owner:docF==='הכל'?PEOPLE[0]:docF,loc:'${loc}'})">+ הוסף מסמך</button>`+
   (dl.map((d,i)=>`<div class="card"><span class="tag">${d.owner?esc(d.owner)+' · ':''}${esc(d.cat)}</span><h3>${esc(d.title)}</h3><p>${esc(d.det)}</p><div class="row">${lk(d).map((l,n)=>`<a class="btn" target="_blank" href="${esc(l)}">קישור ${n+1}</a>`).join('')}<button class="btn alt" ${i?'':'disabled'} onclick="mv('${d.id}',-1)">▲</button><button class="btn alt" ${i<dl.length-1?'':'disabled'} onclick="mv('${d.id}',1)">▼</button><button class="btn alt" onclick="edit('docs',F.docs,'${d.id}')">עריכה</button></div></div>`).join('')||'<div class="empty">כאן שומרים אישורים, ביטוח ודרכונים</div>')}
function logiHTML(){
  const bar=`<div class="chips">${['טיסות','מלונות','ביטוח','מסמכים','הראה לנהג'].map((c,i)=>`<button class="chip ${c===lg?'on':''}" onclick="setLg(${i})">${c}</button>`).join('')}</div>`;
  if(lg==='מסמכים'||lg==='ביטוח')return bar+docsHTML(lg);
  if(lg==='טיסות')return bar+`<button class="btn add" onclick="edit('tr',F.tr)">+ הוסף טיסה / מעבורת</button>`+(S.tr.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(x=>`<div class="card"><span class="tag">${esc(x.type)} · ${esc(x.date)} ${esc(x.time)}</span><h3>${esc(x.title)}</h3><p>${x.ref?'הזמנה: '+esc(x.ref)+'\n':''}${esc(x.note)}</p><button class="btn alt" onclick="edit('tr',F.tr,'${x.id}')">עריכה</button></div>`).join('')||'<div class="empty">הוסיפו טיסות ומעבורות</div>')+docsHTML(lg);
  if(lg==='מלונות')return bar+`<button class="btn add" onclick="edit('hotels',F.hotels,null,{city:cityF==='הכל'?CITIES[0]:cityF})">+ הוסף מלון</button>`+(S.hotels.slice().sort((a,b)=>(a.cin||'').localeCompare(b.cin||'')).map(h=>{const n=h.cin&&h.cout?Math.round((new Date(h.cout)-new Date(h.cin))/864e5):0;return `<div class="card"><span class="tag">${esc(h.city)}${n>0?' · '+n+' לילות':''}</span><h3>${esc(h.name)}</h3><p>${h.cin?`כניסה ${esc(h.cin)} · יציאה ${esc(h.cout)}\n`:''}${esc(h.addr)}${h.ref?'\nהזמנה: '+esc(h.ref):''}</p><div class="row">${h.phone?`<a class="btn alt" href="tel:${esc(h.phone)}">חיוג</a>`:''}${h.addr?`<a class="btn" target="_blank" href="https://waze.com/ul?q=${encodeURIComponent(h.addr)}&navigate=yes">Waze</a>`:''}<button class="btn alt" onclick="edit('hotels',F.hotels,'${h.id}')">עריכה</button></div></div>`}).join('')||'<div class="empty">הוסיפו מלונות עם תאריכים וכתובת</div>')+docsHTML(lg);
  const it=[...S.hotels.map(h=>['hotels',h]),...S.places.filter(x=>x.addr).map(x=>['places',x])];
  return bar+'<p class="tag">בחרו יעד והציגו לנהג המונית או הטוק-טוק</p>'+(it.map(([k,x])=>`<div class="card"><span class="tag">${esc(x.city)}</span><h3>${esc(x.name)}</h3><button class="btn" onclick="drv('${k}','${x.id}')">הראה לנהג</button></div>`).join('')||'<div class="empty">הוסיפו מלון או מקום עם כתובת</div>')}
window.drv=(k,id)=>{const x=S[k].find(y=>y.id===id);document.getElementById('box').innerHTML=`<div style="text-align:center;direction:ltr"><div class="big" style="font-size:30px">กรุณาพาฉันไปที่</div><p style="font-size:20px">Please take me to:</p><div class="big" style="font-size:28px">${esc(x.name)}</div><p style="font-size:20px;color:var(--ink)">${esc(x.addr)}</p>${x.thai?`<p style="font-size:26px;color:var(--ink)">${esc(x.thai)}</p>`:''}${x.phone?`<p style="font-size:20px">${esc(x.phone)}</p>`:''}</div><div class="row"><button class="btn" onclick="document.getElementById('modal').classList.remove('on')">סגור</button></div>`;document.getElementById('modal').classList.add('on')};
const t=id=>document.getElementById('t-'+id);
window.go=x=>{tab=x;render();scrollTo(0,0)};
window.edit=edit;window.F=F;window.push=push;window.pull=pull;
window.addTask=()=>{const v=document.getElementById('nt').value.trim();if(v){S.tasks.push({id:uid(),t:v,done:false,owner:taskF==='הכל'?'משותף':taskF});persist()}};
window.tog=id=>{const k=S.tasks.find(x=>x.id===id);k.done=!k.done;persist()};
window.delTask=id=>{S.tasks=S.tasks.filter(x=>x.id!==id);persist()};
window.saveUrl=()=>{URLX=document.getElementById('url').value.trim();localStorage.setItem('thUrl',URLX);toast(URLX?'מחובר':'נותק');render();pull()};
window.conv=(k,r)=>{const a=document.getElementById(k),b=document.getElementById(k+'i');if(r)a.value=b.value?(b.value/R[k]).toFixed(2):'';else b.value=a.value?(a.value*R[k]).toFixed(2):''};
window.tip=()=>{const v=parseFloat(document.getElementById('bill').value)||0;document.getElementById('tips').innerHTML=TIPS.map(p=>`<div class="row" style="justify-content:space-between;margin:0;padding:7px 0;border-bottom:1px solid var(--line)"><b>${p}%</b><span>טיפ ${(v*p/100).toFixed(2)}</span><span class="tag">סה"כ ${(v*(1+p/100)).toFixed(2)}</span></div>`).join('')};
window.mv=(id,dir)=>{const ids=S.docs.filter(d=>(d.loc||'מסמכים')===lg&&(docF==='הכל'||d.owner===docF)).map(d=>d.id);const k=ids.indexOf(id),o=ids[k+dir];if(o===undefined)return;const x=S.docs.findIndex(d=>d.id===id),y=S.docs.findIndex(d=>d.id===o);[S.docs[x],S.docs[y]]=[S.docs[y],S.docs[x]];persist()};
window.S=S;

async function loadRate(){for(const[k,c]of[['thb','THB'],['usd','USD']]){try{const r=await fetch('https://open.er-api.com/v6/latest/'+c);const d=await r.json();if(d.rates&&d.rates.ILS)R[k]=d.rates.ILS}catch(e){}}localStorage.setItem('thR',JSON.stringify(R));render()}
render();loadRate();loadWeather();pull(true);addEventListener('online',()=>{render();pull(true);loadWeather()});addEventListener('offline',render);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});setInterval(()=>pull(true),30000);
</script>
</body>
</html>
